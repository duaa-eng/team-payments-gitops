apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: payments-prod
spec:
  template:
    spec:
      containers:
        - name: payments-worker
          resources:
            # Aligned with gke-cloud & VPA 'Off' 30-day target (6Gi Guaranteed QoS)
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
