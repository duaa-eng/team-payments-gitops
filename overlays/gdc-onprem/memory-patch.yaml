apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: payments-prod
spec:
  template:
    spec:
      containers:
        - name: payments-worker
          resources:
            # Right-sized to 6Gi per VPA 'Off' target, preserving Guaranteed QoS
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
