apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: payments-oom-precursor-rules
  namespace: payments-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    fleet.gke.io/fleet-scope: team-payments
spec:
  groups:
    - name: oom-precursor-alerts
      interval: 30s
      rules:
        - alert: PaymentsContainerWorkingSetHigh
          expr: |
            (
              max by (project_id, location, cluster, namespace, pod, container) (
                container_memory_working_set_bytes{namespace="payments-prod", container!="", container!="POD"}
              )
              /
              on (project_id, location, cluster, namespace, pod, container)
              max by (project_id, location, cluster, namespace, pod, container) (
                kube_pod_container_resource_limits{namespace="payments-prod", container!="", resource="memory"} > 0
              )
            ) > 0.85
          for: 5m
          labels:
            severity: critical
            fleet_scope: team-payments
          annotations:
            summary: "Container working_set_bytes > 85% of memory limit in payments-prod"
            description: "Active non-reclaimable working set exceeded 85% of cgroup memory limit for 5m (Pre-OOMKilled Exit 137 precursor)."
