apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-cache
  namespace: payments-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=confirm
  labels:
    app: ledger-cache
    fleet.gke.io/fleet-scope: team-payments
spec:
  serviceName: ledger-cache-headless
  replicas: 3
  selector:
    matchLabels:
      app: ledger-cache
  template:
    metadata:
      labels:
        app: ledger-cache
    spec:
      priorityClassName: tier1-mission-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: ledger-cache
          image: europe-west3-docker.pkg.dev/prod-fleet-host/payments/ledger-cache:v1.9.2
          ports:
            - name: tcp-ledger
              containerPort: 5432
              appProtocol: tcp
            - name: prom-metrics
              containerPort: 9187
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/ledger/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: tier1-rwo
        resources:
          requests:
            storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-cache-headless
  namespace: payments-prod
spec:
  clusterIP: None
  selector:
    app: ledger-cache
  ports:
    - name: tcp-ledger
      port: 5432
      appProtocol: tcp
