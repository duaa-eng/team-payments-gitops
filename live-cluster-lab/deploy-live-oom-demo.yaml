# Live GKE Autopilot Demo Manifest (Argolis-Safe, Real Block Disk Page Cache + Real Exit 137 OOM!)
apiVersion: v1
kind: Namespace
metadata:
  name: payments-prod
  labels:
    fleet.gke.io/fleet-scope: team-payments
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-cache-pvc
  namespace: payments-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 1Gi
---
# 1. Suspect A (Red Herring): Reads a 430 MiB file on real ext4 PVC -> high usage_bytes (page cache), tiny working_set_bytes!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-cache
  namespace: payments-prod
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: ledger-cache
  template:
    metadata:
      labels:
        app: ledger-cache
    spec:
      containers:
        - name: ledger-cache
          image: mirror.gcr.io/library/python:3.12-slim
          command: ["python3", "-u", "-c"]
          args:
            - |
              import os, time
              path = "/cache/ledger_blocks.bin"
              print("INFO [ledger-cache] Preparing 420MiB settlement file on persistent ext4 volume...")
              chunk = b"L" * (4 * 1024 * 1024)
              with open(path, "wb") as f:
                  for _ in range(105):
                      f.write(chunk)
                  f.flush()
                  os.fsync(f.fileno())
                  if hasattr(os, "posix_fadvise"):
                      os.posix_fadvise(f.fileno(), 0, 0, os.POSIX_FADV_DONTNEED)
              # Single sequential read places all 420MiB into inactive_file (reclaimable/evictable Linux page cache!)
              with open(path, "rb") as f:
                  while f.read(4 * 1024 * 1024):
                      pass
              while True:
                  print("INFO [ledger-cache] Healthy! Active working_set=~28MiB (5.5%); reclaimable Linux ext4 page-cache=~420MiB (total usage ~88%). 0 restarts.")
                  time.sleep(25)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: cache-vol
              mountPath: /cache
      volumes:
        - name: cache-vol
          persistentVolumeClaim:
            claimName: ledger-cache-pvc
---
# 2. Suspect B (Real Fire!): Climbs steadily over ~70s so GMP scrapes rising working_set_bytes >85% -> OOMKilled (Exit 137)!
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: payments-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      containers:
        - name: payments-worker
          image: mirror.gcr.io/library/python:3.12-slim
          command: ["python3", "-u", "-c"]
          args:
            - |
              import time
              print("INFO [payments-worker] Processing EU SEPA Instant Settlement batch #88412 (280,000 records)...")
              buf = []
              for step in range(1, 80):
                  buf.append(bytearray(8 * 1024 * 1024))
                  mib = step * 8
                  if mib == 440:
                      print("WARN [payments-worker] PRECURSOR: working_set_bytes exceeded 85% (440MiB / 512MiB)! Major page faults rising...")
                  elif mib == 496:
                      print("ERROR [payments-worker] Approaching 512MiB cgroup memory.max ceiling—kernel OOM-killer imminent (Exit Code 137)!")
                  time.sleep(1.1)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
